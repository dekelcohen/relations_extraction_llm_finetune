<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RE dataset viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <h1>RE dataset viewer</h1>
    <p class="report-link"><a id="report-link" href="http://10.45.93.247:8112/report/pilot_compare.html" target="_blank">📊 Eval summary report (scores, lenient, error analysis)</a></p>
    <select id="dataset-select"></select>
    <input id="search" type="text" placeholder="Search id / genre / schema..." autocomplete="off">
    <div class="filter-group" id="lang-filters"></div>
    <div class="filter-group" id="format-filters"></div>
    <div class="filter-group" id="tier-filters"></div>
    <div class="filter-group" id="hardcase-filters"></div>
    <div class="filter-group" id="flag-filters"></div>
    <div id="sample-count" class="muted"></div>
    <ul id="sample-list"></ul>
  </aside>

  <main id="main">
    <div id="empty-state" class="muted">Loading dataset...</div>
    <div id="sample-view" hidden>
      <header id="sample-header"></header>

      <nav id="view-tabs">
        <button class="tab active" data-view="doc">Document</button>
        <button class="tab" data-view="prompts">Prompt chain</button>
      </nav>

      <div id="doc-view">
        <div id="controls">
          <label><input type="checkbox" id="toggle-decoys" checked> Show distractors</label>
          <span id="model-toggles" class="filter-group"></span>
          <span id="legend"></span>
        </div>

        <div id="doc-container" class="doc-text"></div>

        <section id="records-panel"></section>
        <section id="reasoning-panel"></section>
      </div>

      <div id="prompts-view" hidden></div>
    </div>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
