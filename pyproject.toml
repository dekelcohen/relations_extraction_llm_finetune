[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "re_synth"
version = "0.1.0"
description = "Synthetic he/fa/en entity-relation extraction data, scorer/reward and fine-tuning scripts"
requires-python = ">=3.10"
dependencies = ["requests", "python-dotenv"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["re_synth*"]
